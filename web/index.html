<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Make a letter, a book, a few photos or a memory for one person, and give it to them privately.">
  <meta name="theme-color" content="#2E6B4F">

  <!-- Home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keepsake">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Tab icon: the leaf seal. SVG where supported, PNG and ICO otherwise. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">

  <title>Keepsake</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Stone background while the app loads, so there's no white flash. */
    html, body { margin: 0; background: #F1F1EB; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
