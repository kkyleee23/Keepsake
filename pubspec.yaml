name: keepsake
description: "Make something worth keeping, and give it to someone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (single solution for the whole app)
  flutter_riverpod: ^2.6.1

  # Routing (centralized, declarative; creator + recipient route groups)
  go_router: ^14.6.2

  # Local draft persistence so an unfinished Keepsake is never lost
  shared_preferences: ^2.3.3

  # Models / ids / formatting
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

  # Backend (published keepsakes, recipient access with server-side rules)
  supabase_flutter: ^2.8.0

  # Sharing a published keepsake
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/

  fonts:
    # Headings — Montserrat, used for structural titles and the big headline.
    - family: Montserrat
      fonts:
        - asset: fonts/montserrat/montserrat_regular.ttf
          weight: 400
        - asset: fonts/montserrat/montserrat_semibold.ttf
          weight: 600
        - asset: fonts/montserrat/montserrat_bold.ttf
          weight: 700
        - asset: fonts/montserrat/montserrat_extrabold.ttf
          weight: 800
    # Body / UI — Inter for everything else.
    - family: Inter
      fonts:
        - asset: fonts/inter/inter_regular.ttf
          weight: 400
        - asset: fonts/inter/inter_medium.ttf
          weight: 500
        - asset: fonts/inter/inter_semibold.ttf
          weight: 600
        - asset: fonts/inter/inter_bold.ttf
          weight: 700
